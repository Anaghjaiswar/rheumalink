# Define the build configuration once using a YAML anchor

x-core-image: &core-image
  build:
    context: .

services:

  core:
    <<: *core-image  # Reference the build configuration
    restart: always
    volumes:
      - ./core:/core
      - ./scripts:/scripts
      - static_data:/vol/web
    env_file: .env
    command: /scripts/run.sh
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_DEBUG=1
    depends_on:
      - db

    ports:
      - "8000:8000"
    cpus: 2.0
    cpu_shares: 512
    mem_limit: 4g
    mem_reservation: 2g

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"
    cpus: 6.0
    cpu_shares: 2048
    mem_limit: 16g
    mem_reservation: 10g
    volumes:
      - db_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    ports:
      - "5001:6379"
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 2g
    mem_reservation: 1g
    command: redis-server --requirepass ${REDIS_PASSWORD}

  celery-beat:
    <<: *core-image # Reference the build configuration
    command: celery -A core beat -l info
    restart: on-failure
    environment:
      - REDIS=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=devsecretkey
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - ./core:/core
      - static_data:/vol/web
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    depends_on:
      - db
      - redis
      - core

  primary-worker:
    <<: *core-image # Reference the build configuration
    command: celery -A core worker -Q primary -l INFO --pool=threads --concurrency=4
    restart: on-failure
    environment:
      - REDIS=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=devsecretkey
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - ./core:/core
      - static_data:/vol/web
    cpus: 2.0
    cpu_shares: 512
    mem_limit: 2g
    mem_reservation: 1g
    depends_on:
      - db
      - redis
      - core

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - D:/ollama_models:/root/.ollama 
    restart: always
    cpus: 4.0
    mem_limit: 8g


volumes:
  db_data:
  static_data:
  ollama_data: