# Define the build configuration once using a YAML anchor

x-core-image: &core-image
  build:
    context: .

services:

  core:
    <<: *core-image  # Reference the build configuration
    restart: always
    volumes:
      - ./core:/core
      - ./scripts:/scripts
      - static_data:/vol/web
    env_file: .env
    command: /scripts/run.sh
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_DEBUG=1
    depends_on:
      - db

    ports:
      - "8000:8000"
    cpus: 2.0
    cpu_shares: 512
    mem_limit: 4g
    mem_reservation: 2g
    networks:
      - rheuma_network

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"
    cpus: 6.0
    cpu_shares: 2048
    mem_limit: 16g
    mem_reservation: 10g
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - rheuma_network


  redis:
    image: redis:7-alpine
    ports:
      - "5001:6379"
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 2g
    mem_reservation: 1g
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - rheuma_network

  celery-beat:
    <<: *core-image # Reference the build configuration
    command: celery -A core beat -l info
    restart: on-failure
    env_file: .env
    environment:
      - REDIS=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=devsecretkey
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - ./core:/core
      - static_data:/vol/web
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    depends_on:
      - db
      - redis
      - core
      - minio
    networks:
      - rheuma_network

  primary-worker:
    <<: *core-image # Reference the build configuration
    command: celery -A core worker -Q primary -l INFO --pool=threads --concurrency=4
    restart: on-failure
    env_file: .env
    environment:
      - REDIS=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=devsecretkey
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - ./core:/core
      - static_data:/vol/web
    cpus: 2.0
    cpu_shares: 512
    mem_limit: 2g
    mem_reservation: 1g
    depends_on:
      - db
      - redis
      - core
      - minio
    networks:
      - rheuma_network

  whatsapp:
    container_name: whatsapp_wrapper
    build:
      context: ./whatsapp-wrapper
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - PGHOST=db
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASS}
      - PGDATABASE=${DB_NAME}
      - PGPORT=5432
      - PORT=3333
      - POSTBACK_URL=${WHATSAPP_POSTBACK_URL}
      - ENABLE_INCOMING_MESSAGES=${ENABLE_INCOMING_MESSAGES}
    ports:
      - "3333:3333"
    volumes:
      - ./whatsapp-wrapper/src:/usr/src/app/src
    depends_on:
      - db
      - core
    cpus: 0.5
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - rheuma_network


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rheuma-minio
    restart: always
    ports:
      - "7000:7000" # MinIO API Port (django App isse baat karegi)
      - "7001:7001" # MinIO Web Console Port (Admin Dashboard dekhne ke liye)
    volumes:
      - minio_prod_data:/data 
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}      
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=
      - TZ=Asia/Kolkata
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
    command: server /data --address ":7000" --console-address ":7001"
    cpus: 0.5
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rheuma_network



networks:
  rheuma_network:
    external: true

volumes:
  db_data:
  static_data:
  minio_prod_data: